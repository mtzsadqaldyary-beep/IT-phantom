<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Hub - جامعة تعز</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #0f0f0f; /* أسود سينمائي */
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            padding: 20px;
            border: 1px solid #333;
            border-radius: 15px;
            background: #1a1a1a;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        button {
            background-color: #0088cc; /* لون تيليجرام الأزرق */
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>مرحباً بك في IT Phantom</h2>
        <p>بوابتك الذكية لخدمات جامعة تعز</p>
        <button onclick="showAlert()">اضغط هنا</button>
    </div>

    <script>
        // تفعيل واجهة تيليجرام
        const tg = window.Telegram.WebApp;
        tg.expand(); // جعل التطبيق يفتح بكامل الشاشة

        function showAlert() {
            tg.showAlert("أهلاً بك يا مبرمج! هذا أول تطبيق مصغر لك.");
        }
    </script>
</body>
</html>
